services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: financial
      POSTGRES_USER: financial
      POSTGRES_PASSWORD: financial
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financial"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://financial:financial@db:5432/financial
      SECRET_KEY: change-me
    depends_on:
      db: {condition: service_healthy}
    volumes: ["./data:/app/data"]
volumes: {pgdata: {}}
