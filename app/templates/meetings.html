{% extends 'base.html' %}{% block content %}<h1>Meeting intake</h1><form method="post" enctype="multipart/form-data" class="panel"><label>Title<input name="title" value="Daily meeting" required></label><label>Date<input type="date" name="meeting_date" required></label><label>Paste transcript<textarea name="transcript" rows="8"></textarea></label><label>Or upload TXT/audio<input type="file" name="file" accept=".txt,.mp3,.wav,.m4a,.mp4"></label><button>Process meeting</button></form><h2>Processed meetings</h2><ul>{% for m in meetings %}<li><a href="/meetings/{{m.id}}">{{m.meeting_date}} — {{m.title}}</a> · {{m.source_type}} · {{m.status}}</li>{% else %}<li>No meetings.</li>{% endfor %}</ul>{% endblock %}
