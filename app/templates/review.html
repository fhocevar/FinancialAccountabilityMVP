{% extends 'base.html' %}{% block content %}<h1>Human review queue</h1>{% for c in items %}<form method="post" action="/commitments/{{c.id}}/review" class="panel"><div class="grid"><label>Client<input name="client_name" value="{{c.client_name}}"></label><label>Owner<input name="owner" value="{{c.owner}}"></label><label>Due date<input type="date" name="due_date" value="{{c.due_date or ''}}"></label></div><label>Description<textarea name="description">{{c.description}}</textarea></label><p class="muted">Evidence: {{c.evidence}} · Confidence: {{(c.confidence*100)|round|int}}%</p><button name="action" value="approve">Approve</button> <button class="danger" name="action" value="reject">Reject</button></form>{% else %}<p>No items awaiting review.</p>{% endfor %}{% endblock %}
